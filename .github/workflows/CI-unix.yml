name: CI-unix

on:
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!src/win/**'
      - '!.**'
      - '.github/workflows/CI-unix.yml'
  push:
    branches:
      - v[0-9].*
      - master

jobs:
  # 新增：Android 静态库编译任务
  build-android-static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    env:
      NDK_VER: "25.2.9519653"  # 指定稳定版NDK
      ARCH: "arm64"            # 支持修改为 arm/arm64/x86/x86_64
      API_LEVEL: 24
    steps:
      - uses: actions/checkout@v4

      # 设置NDK环境
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      # 配置编译环境
      - name: Configure CMake
        run: |
          cmake -B build–${{ matrix.abi }}\
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM=android-${{ env.API_LEVEL }} \
            –DBUILD_SHARED_LIBS=OFF \
            -DLIBUV_BUILD_SHARED=OFF  # 强制编译静态库

      # 编译静态库
      - name: Build Static Library
        run: |
          cmake --build build–${{ matrix.abi }}

      # 收集输出文件
      - name: Package Artifacts
        run: |
          mkdir -p out–${{ matrix.abi }}/{lib,include}
          #cp build-${{ matrix.abi }}/libuv.a out–${{ matrix.abi }}/lib/
          cp -r include/* out–${{ matrix.abi }}/include/  # 同步头文件
          #zip -r libuv-android-${{ matrix.abi }}.zip out–${{ matrix.abi }}/

      # 上传多平台产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libuv-android-${{ matrix.abi }}
          path: out–${{ matrix.abi }}
          retention-days: 7
          
  
